# Nginx Reverse Proxy Configuration for pandyaHomeLab
# Per ADR-019: Internet Access from NAS & Domain Routing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # JSON access log — feeds the analytics ingester (Phase: visitor analytics)
    # `escape=json` ensures special chars in path/referrer/user_agent are safely escaped.
    # Note: behind Cloudflare Tunnel, $remote_addr is the tunnel daemon's internal IP;
    # the real visitor IP is in $http_cf_connecting_ip. Logging both — ingester picks.
    # Content-Security-Policy, REPORT-ONLY since 2026-09-26: browsers enforce nothing,
    # they POST what they would have blocked to /csp-report (logs/nginx/csp-report.log).
    # Every page loads only from this site: Mermaid and Chart.js are self-hosted under
    # /vendor/ (website/vendor/), no fonts or scripts come from other hosts. 'unsafe-inline'
    # stays for scripts until the demos' inline <script> blocks and on*= handlers move to
    # files; the policy still blocks scripts from any other host and locks down
    # connect/frame/object/base/form.
    # One definition (a map, since add_header takes variables) for every server block.
    map $host $csp_policy {
        default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri https://pandyahomelab.com/csp-report";
    }

    log_format csp_report escape=json
        '{"timestamp":"$time_iso8601","cf_connecting_ip":"$http_cf_connecting_ip",'
        '"user_agent":"$http_user_agent","report":"$request_body"}';

    # Keyed on the visitor IP: behind the tunnel $remote_addr is always cloudflared.
    limit_req_zone $http_cf_connecting_ip zone=csp_report:1m rate=5r/s;
    # cricstat-api (F5 §2): about 10 requests/s per visitor, burst 20.
    limit_req_zone $http_cf_connecting_ip zone=cricstat_api:1m rate=10r/s;

    log_format json_combined escape=json
        '{'
          '"timestamp":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"cf_connecting_ip":"$http_cf_connecting_ip",'
          '"cf_country":"$http_cf_ipcountry",'
          '"method":"$request_method",'
          '"path":"$request_uri",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"referrer":"$http_referer",'
          '"user_agent":"$http_user_agent"'
        '}';

    upstream ml_projects {
        server ml-iris-knn:8000 max_fails=3 fail_timeout=30s;
    }

    upstream ml_housing {
        server ml-housing-linear:8000 max_fails=3 fail_timeout=30s;
    }

    upstream ml_titanic {
        server ml-titanic-automl:8000 max_fails=3 fail_timeout=30s;
    }

    upstream ml_mlflow {
        server ml-mlflow:5000 max_fails=3 fail_timeout=30s;
    }

    upstream dl_mlflow {
        server dl-mlflow:5000 max_fails=3 fail_timeout=30s;
    }

    upstream nlp_mlflow {
        server nlp-mlflow:5000 max_fails=3 fail_timeout=30s;
    }

    upstream nlp_quora {
        server nlp-quora-randomforest:8000 max_fails=3 fail_timeout=30s;
    }

    upstream nlp_imdb_textrep {
        server nlp-imdb-textrep:8000 max_fails=3 fail_timeout=30s;
    }

    upstream nlp_text8_word2vec {
        server nlp-text8-word2vec:8000 max_fails=3 fail_timeout=30s;
    }

    upstream nlp_ewt_hmm {
        server nlp-ewt-hmm:8000 max_fails=3 fail_timeout=30s;
    }

    upstream dl_mnist {
        server dl-mnist-cnn:8000 max_fails=3 fail_timeout=30s;
    }

    upstream dl_lstm {
        server dl-lstm-forecast:8000 max_fails=3 fail_timeout=30s;
    }

    upstream admin_portal {
        server admin-portal:8000 max_fails=3 fail_timeout=30s;
    }

    # cricstat flagship (ADR-022). Nginx reaches it over cricstat-network (leg 172.25.0.20).
    upstream cricstat_api {
        server cricstat-api:8000 max_fails=3 fail_timeout=30s;
    }

    # MLflow is public READ-ONLY. Every MLflow location checks this and returns
    # 403 when it is 1. The UI issues some reads as POST (the */search endpoints,
    # and GraphQL, whose only "mutations" in MLflow 3.11 are searchRuns /
    # searchDatasets / a no-op test), so those are allowlisted; every other
    # non-GET method (create, update, delete, log-*, artifact upload) is refused.
    # Services log over the Docker domain networks (http://ml-mlflow:5000,
    # http://dl-mlflow:5000) and the operator via LAN :5000, never through here.
    map "$request_method:$uri" $mlflow_write_denied {
        default 1;
        "~^(GET|HEAD|OPTIONS):" 0;
        "~^POST:.*/(runs|experiments|logged-models|traces|model-versions|registered-models)/search(-datasets)?$" 0;
        "~^POST:.*/graphql$" 0;
    }


    # HTTP server (redirect to HTTPS)
    # Sink for /csp-report: answers 204 so the proxied report body gets logged.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location / {
            return 204;
        }
    }

    server {
        listen 80;
        server_name pandyahomelab.com www.pandyahomelab.com;

        # Container healthcheck probes http://localhost/health over plain HTTP.
        # This MUST stay a location (not a server-level return): a server-level
        # `return` runs in the rewrite phase and short-circuits location matching,
        # which previously 301'd the healthcheck. `wget --spider` does not follow
        # redirects, so the check failed on every interval and the container never
        # became healthy. Keep this block ahead of the catch-all redirect.
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name pandyahomelab.com www.pandyahomelab.com;

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;
        gzip_min_length 1000;

        # Logging
        access_log /var/log/nginx/access.log combined;
        access_log /var/log/nginx/access.json.log json_combined;
        error_log /var/log/nginx/error.log warn;

        # Security headers. `always` keeps them on 4xx/5xx too. add_header is only
        # inherited by locations that set NO add_header of their own, so any
        # location that adds one (e.g. `location /` below) must repeat this block.
        # HSTS omits includeSubDomains: other *.pandyahomelab.com hosts are not all
        # under this nginx. CSP is report-only for now (see the map at the top).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $csp_policy always;
        # MLflow sends its own nosniff / X-Frame-Options; drop them so each
        # header appears once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # CSP violation reports (report-uri). POST only, small bodies, rate-limited per
        # visitor. $request_body is only filled when nginx reads the body, which
        # proxy_pass does, so the report is proxied to a local 204 sink. Logged to its own
        # file only: kept out of access.json.log and so out of analytics.
        location = /csp-report {
            limit_except POST { deny all; }
            limit_req zone=csp_report burst=20 nodelay;
            client_max_body_size 8k;
            client_body_buffer_size 8k;
            access_log /var/log/nginx/csp-report.log csp_report;
            proxy_pass http://127.0.0.1:8081/;
        }

        # Landing page
        location / {
            root /var/www/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600";
            # Repeated from the server block (own add_header cancels inheritance).
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy-Report-Only $csp_policy always;
        }

        # ── cricstat (ADR-022, P0.4) ────────────────────────────────────────────────
        # Static pages from cricstat/web (bind-mounted read-only at /var/www/cricket);
        # player and team pages are one shell each, filled by JS from the API (their heads are
        # server-rendered by the API since P0.6):
        #   /cricket/players/<name>-<8-hex id>/  and  /cricket/countries/<team-slug>/
        location = /cricket { return 301 /cricket/; }

        # cricstat-api's internal admin endpoints serve the admin portal over
        # cricstat-network only. Never public.
        location ^~ /cricket/api/v1/admin/ { return 404; }

        # Stats API (F5): GET only, rate-limited per visitor, prefix stripped (the app
        # answers at /v1/...). The API sets its own Cache-Control / ETag. API calls are
        # not page views: logged to the plain access log only, so they stay out of the
        # visitor analytics (same treatment as /admin/).
        location ^~ /cricket/api/ {
            limit_except GET HEAD { deny all; }
            limit_req zone=cricstat_api burst=20 nodelay;
            limit_req_status 429;
            access_log /var/log/nginx/access.log combined;
            proxy_pass http://cricstat_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Self-hosted public-domain flags (SVG). Served under a no-script CSP, so even a file
        # opened directly can't run anything; fetch_flags.py also rejects active SVGs.
        location ^~ /cricket/flags/ {
            root /var/www;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000";
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # Player photos (P0.5): small copies of Wikimedia Commons images, downloaded by the
        # pipeline's `enrich` step into cricstat/data/photos (mounted read-only). Images only,
        # under a no-script CSP; only hash-named image files match (anything else under
        # /cricket/photos/ falls through to the static /cricket/ location and 404s).
        location ~ "^/cricket/photos/([0-9a-f]{16}\.(?:jpg|png|webp))$" {
            limit_except GET HEAD { deny all; }
            alias /var/www/cricket-photos/$1;
            add_header Cache-Control "public, max-age=2592000";
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        # Player and team pages (P0.6): cricstat-api returns the same static shell with the page's
        # own title, description, canonical URL, robots rule, JSON-LD and a server-rendered summary
        # (so search engines and link previews see real content), a 301 to the canonical slug, or a
        # real 404. If the API is down (502/503/504) the plain shell is served, as before P0.6.
        # Page views keep the default (analytics) access log.
        location ~ ^/cricket/(players|countries)/([a-z0-9-]+)/$ {
            limit_except GET HEAD { deny all; }
            limit_req zone=cricstat_api burst=20 nodelay;
            limit_req_status 429;
            set $cricstat_section $1;
            proxy_pass http://cricstat_api/pages/$1/$2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @cricstat_shell;
            # Repeated from the server block (own add_header cancels inheritance).
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy-Report-Only $csp_policy always;
        }

        # The ODI World Cup 2027 predictor (2026-10-10): cricstat-api writes the live forecast into the page
        # (title, description, "the forecast in words", FAQ JSON-LD) so search engines see real numbers;
        # the static page if the API is down. Same headers and logging as the player/team pages.
        location = /cricket/predictor/ {
            limit_except GET HEAD { deny all; }
            limit_req zone=cricstat_api burst=20 nodelay;
            limit_req_status 429;
            set $cricstat_section predictor;
            proxy_pass http://cricstat_api/pages/predictor/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @cricstat_shell;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy-Report-Only $csp_policy always;
        }

        location @cricstat_shell {
            root /var/www;
            try_files /cricket/$cricstat_section/index.html =404;
            add_header Cache-Control "public, max-age=300";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy-Report-Only $csp_policy always;
        }

        # Sitemap of the player and team pages worth indexing (built by cricstat-api from the
        # serving DB; listed in robots.txt next to the site's static sitemap.xml).
        location = /cricket/sitemap.xml {
            limit_except GET HEAD { deny all; }
            access_log /var/log/nginx/access.log combined;
            proxy_pass http://cricstat_api/pages/sitemap.xml;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location /cricket/ {
            root /var/www;
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=3600";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy-Report-Only $csp_policy always;
        }

        # ML domain routes — each project gets its own sub-path per ADR-004
        location /ml/iris-knn/ {
            proxy_pass http://ml_projects/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /ml/housing-linear/ {
            proxy_pass http://ml_housing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /ml/titanic-automl/ {
            proxy_pass http://ml_titanic/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # /ml/ root — ML domain listing
        location = /ml/ {
            return 200 '{"domain":"ml","projects":["iris-knn","housing-linear","titanic-automl"],"status":"active"}';
            add_header Content-Type application/json;
        }

        # DL domain routes — Phase 2a + 2b active
        location /dl/mnist-cnn/ {
            proxy_pass http://dl_mnist/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            # First /predict triggers ~8 min CNN training in-process; give the
            # demo time to respond on cold-start before Nginx returns 504.
            proxy_read_timeout 600s;
        }

        location /dl/lstm-forecast/ {
            proxy_pass http://dl_lstm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            # LSTM training is ~10s (vs CNN's 8 min) but eager warm-up at
            # container startup means /forecast typically returns in ~2s.
            # Use the same 600s ceiling as /dl/mnist-cnn/ for safety in
            # case a warm-up race causes lazy in-request training.
            proxy_read_timeout 600s;
        }

        # /dl/ root — DL domain listing
        location = /dl/ {
            return 200 '{"domain":"dl","projects":["mnist-cnn","lstm-forecast"],"status":"active"}';
            add_header Content-Type application/json;
        }

        # NLP domain routes — Phase 3a + 3b + 3c + 3d active
        location /nlp/quora-randomforest/ {
            proxy_pass http://nlp_quora/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            # Eager warm-up (~5 min: 22 features + Random Forest on 100k pairs) runs
            # at container start; a /predict during that window blocks on the train
            # lock. Same 600s ceiling as the DL demos (Cloudflare still cuts at 100s).
            proxy_read_timeout 600s;
        }

        location /nlp/imdb-textrep/ {
            proxy_pass http://nlp_imdb_textrep/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            # Eager warm-up (~5 min: spaCy + 2 vectorizers + 4 LogReg on 25k reviews);
            # same 600s ceiling as the other demos.
            proxy_read_timeout 600s;
        }

        location /nlp/text8-word2vec/ {
            proxy_pass http://nlp_text8_word2vec/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            # Vectors are trained offline and only loaded at startup (seconds), so
            # queries never wait on training.
            proxy_read_timeout 60s;
        }

        location /nlp/ewt-hmm/ {
            proxy_pass http://nlp_ewt_hmm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            # Warm-up is ~20 s (three HMMs counted + the EWT test set tagged by spaCy);
            # a /predict during it waits on the train lock, well inside 60s.
            proxy_read_timeout 60s;
        }

        # /nlp/ root — NLP domain listing
        location = /nlp/ {
            return 200 '{"domain":"nlp","projects":["quora-randomforest","imdb-textrep","text8-word2vec","ewt-hmm"],"status":"active"}';
            add_header Content-Type application/json;
        }

        # Unknown /nlp/ paths. Every Phase 3 demo (3a-3d) has its own location above; a
        # future demo gets one only once its container exists (Nginx resolves upstreams
        # eagerly at startup).
        location /nlp/ {
            return 503 '{"status":"coming_soon","domain":"nlp"}';
            add_header Content-Type application/json;
        }

        # Agentic — coming soon (no upstream blocks until containers exist)
        location /agentic/ {
            return 503 '{"status":"coming_soon","domain":"agentic"}';
            add_header Content-Type application/json;
        }

        # Admin portal — visitor analytics dashboard + feedback moderation.
        # HTTP Basic Auth enforced inside the upstream (admin-portal container).
        # IMPORTANT: `proxy_pass http://admin_portal;` (NO trailing slash) preserves
        # the full URI — so /admin/feedback arrives at the upstream as /admin/feedback,
        # not /feedback (which would collide with the public feedback router).
        # Per-location access_log lists only `combined` → /admin/* excluded from
        # the JSON analytics log (keeps admin traffic out of visitor counts).
        location /admin/ {
            access_log /var/log/nginx/access.log combined;
            proxy_pass http://admin_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Public feedback API — likes + comments (anonymous, rate-limited in app)
        # Same upstream as /admin/, but no Basic Auth (POST endpoints handle their own
        # validation + DB-layer rate limit). NO trailing slash on proxy_pass → preserves
        # the /feedback/ prefix so it hits the FastAPI feedback router (not the admin one).
        # Per-location access_log lists only `combined` → /feedback/* excluded from the
        # JSON analytics log (likes/comments are not visitor pageviews).
        location /feedback/ {
            access_log /var/log/nginx/access.log combined;
            proxy_pass http://admin_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # MLflow UI — experiment tracking
        location /mlflow/ {
            if ($mlflow_write_denied) { return 403; }   # public read-only; see map above
            proxy_pass http://ml_mlflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # MLflow API — browser JS calls these without the /mlflow/ prefix
        location /api/2.0/mlflow {
            if ($mlflow_write_denied) { return 403; }   # public read-only; see map above
            proxy_pass http://ml_mlflow/api/2.0/mlflow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ajax-api/2.0/mlflow {
            if ($mlflow_write_denied) { return 403; }   # public read-only; see map above
            proxy_pass http://ml_mlflow/ajax-api/2.0/mlflow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MLflow GraphQL — used by MLflow 3.x experiment overview charts
        location /graphql {
            if ($mlflow_write_denied) { return 403; }   # public read-only; see map above
            proxy_pass http://ml_mlflow/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── dl-mlflow subdomain (per-domain MLflow exposure pattern) ───────────────
    # Host-based routing isolates dl-mlflow from ml-mlflow completely: the
    # un-prefixed /api/2.0/mlflow, /ajax-api/2.0/mlflow, /graphql paths route
    # to dl_mlflow here (no collision with ml_mlflow because the host header
    # disambiguates). Cloudflared tunnel forwards mlflow-dl.pandyahomelab.com
    # to https://localhost:8443 with noTLSVerify; this server block matches it.
    # Logging uses combined-only — MLflow is ops/dev surface, not visitor
    # traffic, so it stays out of the JSON analytics log.
    server {
        listen 443 ssl http2;
        server_name mlflow-dl.pandyahomelab.com;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        access_log /var/log/nginx/access.log combined;
        error_log /var/log/nginx/error.log warn;

        # Same security headers as the main server block (see comments there).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $csp_policy always;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        location / {
            if ($mlflow_write_denied) { return 403; }   # public read-only; see map above
            proxy_pass http://dl_mlflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # ─── nlp-mlflow subdomain (same pattern as mlflow-dl, Phase 3.0) ───────────────
    # Host-based routing isolates nlp-mlflow from ml-mlflow and dl-mlflow: the
    # un-prefixed /api/2.0/mlflow, /ajax-api/2.0/mlflow, /graphql paths route
    # to nlp_mlflow here (no collision with ml_mlflow because the host header
    # disambiguates). Cloudflared tunnel forwards mlflow-nlp.pandyahomelab.com
    # to https://localhost:8443 with noTLSVerify; this server block matches it.
    # Logging uses combined-only — MLflow is ops/dev surface, not visitor
    # traffic, so it stays out of the JSON analytics log.
    server {
        listen 443 ssl http2;
        server_name mlflow-nlp.pandyahomelab.com;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        access_log /var/log/nginx/access.log combined;
        error_log /var/log/nginx/error.log warn;

        # Same security headers as the main server block (see comments there).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only $csp_policy always;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        location / {
            if ($mlflow_write_denied) { return 403; }   # public read-only; see map above
            proxy_pass http://nlp_mlflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
