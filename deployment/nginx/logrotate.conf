# Weekly rotation for the nginx logs bind-mounted at logs/nginx.
#
# The compose `logging:` limits only cover Docker's own json-file logs; these
# files are written straight to the NAS and would otherwise grow forever.
#
# Runs as root from a DSM Task Scheduler job via rotate-logs.sh (see that file).
#
# Rename + `nginx -s reopen`, NOT copytruncate: analytics-ingester tails
# access.json.log by (inode, offset). A new inode makes it restart at offset 0;
# a same-inode truncate would leave it seeking past EOF and stall analytics.
# Cost: lines written in the ≤2 s between its last poll and the reopen are not
# ingested — once a week.

/volume1/pandya-homelab/logs/nginx/access.log
/volume1/pandya-homelab/logs/nginx/access.json.log
/volume1/pandya-homelab/logs/nginx/error.log
{
    weekly
    rotate 12
    dateext
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        /usr/local/bin/docker exec pandya-nginx nginx -s reopen >/dev/null 2>&1 || true
    endscript
}
