version: '3.8'

# ML Domain Infrastructure & Projects
# Each service connects to ml-network (172.20.0.0/24, isolated)

networks:
  ml-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

services:
  # Infrastructure Services (shared by 2 projects per domain)

  ml-postgres:
    image: postgres:16-alpine
    container_name: ml-postgres
    environment:
      POSTGRES_DB: ${ML_POSTGRES_DB:-mldb}
      POSTGRES_USER: ${ML_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ML_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"   # NAS-only; nginx uses ml-network
    volumes:
      - ml_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ML_POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ml-network:
        ipv4_address: 172.20.0.2
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ml-minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e   # RELEASE.2025-09-07T16-13-09Z — digest pin; Docker Hub no longer serves MinIO anonymously
    container_name: ml-minio
    environment:
      MINIO_ROOT_USER: ${ML_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ML_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"   # NAS-only; nginx uses ml-network
      - "9001:9001"
    volumes:
      - ml_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ml-network:
        ipv4_address: 172.20.0.3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ml-redis:
    image: redis:7-alpine
    container_name: ml-redis
    ports:
      - "127.0.0.1:6379:6379"   # NAS-only; nginx uses ml-network
    volumes:
      - ml_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ml-network:
        ipv4_address: 172.20.0.4
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ml-mlflow:
    image: ghcr.io/mlflow/mlflow@sha256:c4cfc7eb77caf73c84b084d93456bc904500884a93b5348934ae42b351cc1263   # MLflow 3.11.1 — digest pin; the v3.11.1 tag was re-pushed and no longer matches
    container_name: ml-mlflow
    environment:
      GIT_PYTHON_REFRESH: quiet
      # MLflow 3.x starts a background job runner + 6 huey workers (~1.1 GB idle) for
      # GenAI features only (issue detection, LLM scorers, prompt optimisation). The ML
      # demos don't use them and the public tracker is read-only, so it stays off.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlruns.db
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --workers 2
      --allowed-hosts "*"
      --cors-allowed-origins "https://pandyahomelab.com"
    ports:
      - "5000:5000"
    volumes:
      - ml_mlflow_data:/mlflow
      - ml_mlartifacts_data:/mlartifacts
    depends_on:
      ml-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      ml-network:
        ipv4_address: 172.20.0.5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Project Services (placeholder — built from ml/ml-iris-knn/ and ml/ml-housing/)
  # These will be added in docker-compose.dev.yml with source mounts

volumes:
  ml_postgres_data:
  ml_minio_data:
  ml_redis_data:
  ml_mlflow_data:
  ml_mlartifacts_data:
