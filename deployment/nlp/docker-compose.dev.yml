version: '3.8'

# Dev overlay: NLP project containers attached to nlp-network.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Slots (docs/NETWORK_CIDR_SUMMARY.md §5/§8). Every host port binds 127.0.0.1:
#   - nlp-quora-randomforest   172.22.0.10 → 127.0.0.1:8020   (Phase 3a)
#   - 3b slot                  172.22.0.11 → 127.0.0.1:8021   (Phase 3b)
#   - 3c slot                  172.22.0.12 → 127.0.0.1:8022   (Phase 3c)
#   - 3d slot                  172.22.0.13 → 127.0.0.1:8023   (Phase 3d)
#
# Each service: MLFLOW_TRACKING_URI=http://nlp-mlflow:5000, depends_on nlp-mlflow
# (service_healthy) only — no postgres/minio/redis (G1).

services:
  nlp-quora-randomforest:
    image: nlp-quora-randomforest:latest
    # `build:` so `docker compose build` actually builds (a service with only
    # `image:` makes it a silent no-op; see deployment_image_rebuild_rules).
    build:
      context: ../../nlp/nlp-quora-randomforest
      dockerfile: docker/Dockerfile
    container_name: nlp-quora-randomforest
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://nlp-mlflow:5000
      QQP_DATA_DIR: /app/data/qqp
      QQP_MAX_TRAIN_ROWS: "100000"
    ports:
      - "127.0.0.1:8020:8000"   # NAS-only; public traffic comes via nginx
    volumes:
      # GLUE QQP is non-commercial, so it is mounted, never baked into the image.
      # The container runs as uid 1000; data/qqp carries a read-only `everyone`
      # Synology ACE for that (see the project README), not `user: "0:0"`.
      - /volume1/pandya-homelab/nlp/nlp-quora-randomforest/data/qqp:/app/data/qqp:ro
    networks:
      nlp-network:
        ipv4_address: 172.22.0.10
    depends_on:
      nlp-mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      # /health answers as soon as uvicorn binds; the ~5 min warm-up (features +
      # Random Forest on 100k pairs) runs in the background.
      start_period: 60s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
