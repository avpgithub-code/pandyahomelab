# cricstat publish (F9). Builds, smoke-tests and publishes the pipeline image to GHCR, behind the
# `nas-production` approval gate. Runs ONLY when the image's own files change on main (docs-only
# changes no longer ask for approval), or when started by hand. The NAS pulls it via cd-pull.sh.
# Lint/tests live in cricstat-ci.yml and run on every change.
name: cricstat-publish

on:
  push:
    branches: [main]
    paths: ["cricstat/cricstat-pipeline/**"]   # edits to this file: test with a manual run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cricstat-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: nas-production          # required reviewer = the approval gate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: cricstat/cricstat-pipeline
          file: cricstat/cricstat-pipeline/docker/Dockerfile
          load: true
          tags: cricstat-pipeline:smoke
      - name: Smoke test as the operator UID (catches the Synology 700-bits trap)
        run: docker run --rm -u 1026:100 cricstat-pipeline:smoke --help
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/avpgithub-code/cricstat-pipeline
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=cricstat-pipeline
            org.opencontainers.image.description=Cricsheet ingestion job for cricstat (pandyaHomeLab)
      - name: Publish (same build, from cache)
        uses: docker/build-push-action@v7
        with:
          context: cricstat/cricstat-pipeline
          file: cricstat/cricstat-pipeline/docker/Dockerfile
          platforms: linux/amd64        # the NAS is x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
