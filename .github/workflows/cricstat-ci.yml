# cricstat CI skeleton (F6/F9). Lint + tests on every push/PR touching cricstat, plus an image build check.
# No secrets, no deploy: CD (pull-based, NAS-side) is added in F9/P5.
name: cricstat-ci

on:
  push:
    paths: ["cricstat/**", "deployment/cricstat/**", ".github/workflows/cricstat-ci.yml"]
  pull_request:
    paths: ["cricstat/**", "deployment/cricstat/**", ".github/workflows/cricstat-ci.yml"]

permissions:
  contents: read

concurrency:
  group: cricstat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-tests:
    # 22.04 still ships Python 3.8 builds; 3.8 = the NAS host interpreter, 3.12 = the container image.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    defaults:
      run:
        working-directory: cricstat/cricstat-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  pipeline-image:
    runs-on: ubuntu-22.04
    needs: pipeline-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build cricstat-pipeline image (no push)
        run: docker build -f cricstat/cricstat-pipeline/docker/Dockerfile -t cricstat-pipeline:ci cricstat/cricstat-pipeline
      - name: Smoke test (CLI help runs inside the image)
        run: docker run --rm cricstat-pipeline:ci --help
