# cricstat CI (F6/F9): every push/PR touching cricstat → lint + tests (py3.8 & 3.12) + image build + smoke.
# Publishing is separate (cricstat-publish.yml) so docs-only changes never ask for a deploy approval.
name: cricstat-ci

on:
  push:
    paths: ["cricstat/**", "deployment/cricstat/**", ".github/workflows/cricstat-ci.yml"]
  pull_request:
    paths: ["cricstat/**", "deployment/cricstat/**", ".github/workflows/cricstat-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cricstat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-tests:
    # 22.04 still ships Python 3.8 builds; 3.8 = the NAS host interpreter, 3.12 = the container image.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    defaults:
      run:
        working-directory: cricstat/cricstat-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  pipeline-image:
    runs-on: ubuntu-22.04
    needs: pipeline-tests
    steps:
      - uses: actions/checkout@v7
      - name: Build cricstat-pipeline image (no push)
        run: docker build -f cricstat/cricstat-pipeline/docker/Dockerfile -t cricstat-pipeline:ci cricstat/cricstat-pipeline
      - name: Smoke test as a non-root user (catches unreadable /app, the Synology 700-bits trap)
        run: docker run --rm -u 1026:100 cricstat-pipeline:ci --help
