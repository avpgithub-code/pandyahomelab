# cricstat CI (F6/F9): every push/PR touching cricstat → lint + tests (py3.8 & 3.12) + image build + smoke.
# Publishing is separate (cricstat-publish.yml) so docs-only changes never ask for a deploy approval.
name: cricstat-ci

on:
  push:
    paths: ["cricstat/**", "deployment/cricstat/**", ".github/workflows/cricstat-ci.yml"]
  pull_request:
    paths: ["cricstat/**", "deployment/cricstat/**", ".github/workflows/cricstat-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cricstat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-tests:
    # 22.04 still ships Python 3.8 builds; 3.8 = the NAS host interpreter, 3.12 = the container image.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    defaults:
      run:
        working-directory: cricstat/cricstat-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  pipeline-image:
    runs-on: ubuntu-22.04
    needs: pipeline-tests
    steps:
      - uses: actions/checkout@v7
      - name: Build cricstat-pipeline image (no push)
        run: docker build -f cricstat/cricstat-pipeline/docker/Dockerfile -t cricstat-pipeline:ci cricstat
      - name: Smoke test as a non-root user (catches unreadable /app, the Synology 700-bits trap)
        run: docker run --rm -u 1026:100 cricstat-pipeline:ci --help
      - name: Smoke test the build step's SQL is in the image and readable
        run: docker run --rm -u 1026:100 --entrypoint python3 cricstat-pipeline:ci -c "import os; [open(os.path.join('/cricstat/sql', n)).read() for n in ('serving_schema.sql', 'reference_data.sql', 'semantic_views.sql', 'semantic_catalog.sql', 'venue_map.csv')]"

  api-tests:
    # The API tests build their fixture DB with cricstat-pipeline (stdlib) in subprocesses.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    defaults:
      run:
        working-directory: cricstat/cricstat-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  api-image:
    runs-on: ubuntu-22.04
    needs: api-tests
    steps:
      - uses: actions/checkout@v7
      - name: Build cricstat-api image (no push)
        run: docker build -f cricstat/cricstat-api/docker/Dockerfile -t cricstat-api:ci cricstat
      - name: Smoke test as the operator UID, read-only root, no DB → expect 503 no_db
        run: |
          docker run -d --name api -u 1026:100 --read-only --tmpfs /tmp -p 127.0.0.1:8049:8000 cricstat-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o body.json -w '%{http_code}' http://127.0.0.1:8049/v1/health || true)
            [ "$code" = 503 ] && grep -q no_db body.json && { echo "ok: $(cat body.json)"; exit 0; }
            sleep 1
          done
          docker logs api; exit 1
      - name: The golden selection is in the image and readable by the operator UID
        run: docker run --rm -u 1026:100 --entrypoint python3 cricstat-api:ci -c "print(len(open('/cricstat/docs/validation/golden-selection.csv').readlines()))"

  models-tests:
    # cricstat-models (P1): stdlib only, so it also runs on the NAS host's Python 3.8. Tests build
    # tiny serving DBs from cricstat/sql/serving_schema.sql and never touch the network.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    defaults:
      run:
        working-directory: cricstat/cricstat-models
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  models-image:
    runs-on: ubuntu-22.04
    needs: models-tests
    steps:
      - uses: actions/checkout@v7
      - name: Build cricstat-models image (no push)
        run: docker build -f cricstat/cricstat-models/docker/Dockerfile -t cricstat-models:ci cricstat
      - name: Smoke test as the operator UID, read-only root (catches the Synology 700-bits trap)
        run: docker run --rm -u 1026:100 --read-only --tmpfs /tmp -e CRICSTAT_LOG_DIR=/tmp/logs cricstat-models:ci --help
      - name: The reviewed inputs are in the image and readable
        run: >
          docker run --rm -u 1026:100 --entrypoint python3 cricstat-models:ci -c
          "import os, application_logic.services.forecast_service;
          [open(p).read() for p in ('/cricstat/sql/venue_map.csv', 'supplement/afg_odi_results.csv',
          'supplement/reviews.csv', 'tournaments/wc2027/fixtures.csv', 'ratings/icc_full_members.csv')]"
