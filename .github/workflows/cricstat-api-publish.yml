# cricstat-api publish (F9 pattern, P0.3). Builds, smoke-tests and publishes the API image to GHCR, behind the
# `nas-production` approval gate. Runs ONLY when the API code or the golden selection changes on main (docs-only
# changes no longer ask for approval), or when started by hand. The NAS pulls it via cd-pull.sh.
# Lint/tests live in cricstat-ci.yml and run on every change.
name: cricstat-api-publish

on:
  push:
    branches: [main]
    paths: ["cricstat/cricstat-api/**", "cricstat/docs/validation/golden-selection.csv"]   # image inputs; edits to this file: test with a manual run
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces an older one in this group, including one still waiting at the
# nas-production approval gate: every run builds the latest main, so the newest run is the only
# one worth approving (an unapproved old run used to block newer ones). A run already pushing
# when a newer one starts is cancelled too; that is safe, because the newer run pushes again and
# cd-pull.sh deploys only images that passed its NAS smoke test.
concurrency:
  group: cricstat-api-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: nas-production          # required reviewer = the approval gate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: cricstat
          file: cricstat/cricstat-api/docker/Dockerfile
          load: true
          tags: cricstat-api:smoke
      - name: Smoke test as the operator UID, read-only root, no DB → expect 503 no_db
        run: |
          docker run -d --name api -u 1026:100 --read-only --tmpfs /tmp -p 127.0.0.1:8049:8000 cricstat-api:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o body.json -w '%{http_code}' http://127.0.0.1:8049/v1/health || true)
            [ "$code" = 503 ] && grep -q no_db body.json && { echo "ok: $(cat body.json)"; exit 0; }
            sleep 1
          done
          docker logs api; exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/avpgithub-code/cricstat-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=cricstat-api
            org.opencontainers.image.description=GET-only cricket statistics API for cricstat (pandyaHomeLab)
      - name: Publish (same build, from cache)
        uses: docker/build-push-action@v7
        with:
          context: cricstat
          file: cricstat/cricstat-api/docker/Dockerfile
          platforms: linux/amd64        # the NAS is x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
