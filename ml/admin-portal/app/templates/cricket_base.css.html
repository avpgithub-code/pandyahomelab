<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --border:#252a38; --accent:#4f8ef7;
          --green:#22c55e; --amber:#facc15; --red:#ef4444; --purple:#a855f7; --saffron:#FF9933;
          --text:#e2e8f0; --muted:#64748b; --radius:8px; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text);
         padding:2rem 1rem; line-height:1.5; min-height:100vh; }
  .container { max-width:1100px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:1rem;
           margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
  h1 { font-size:1.5rem; font-weight:800; } h1 em { font-style:normal; color:var(--saffron); }
  .meta { color:var(--muted); font-size:.85rem; display:flex; gap:.8rem; flex-wrap:wrap; align-items:center; }
  .meta a, a { color:var(--accent); text-decoration:none; }
  h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700;
       margin:2rem 0 .8rem; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:.75rem; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.9rem 1rem; }
  .card-label { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; }
  .card-value { font-size:1.5rem; font-weight:800; margin-top:.2rem; }
  .card-sub { color:var(--muted); font-size:.75rem; }
  .table-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
  table { width:100%; border-collapse:collapse; font-size:.85rem; background:var(--surface); }
  th, td { padding:.5rem .7rem; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; background:var(--surface2); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; padding:.05rem .55rem; border-radius:99px; font-size:.72rem; font-weight:700;
          border:1px solid currentColor; white-space:nowrap; }
  .ok, .match { color:var(--green); } .bad, .DIFF { color:var(--red); } .warn, .stale { color:var(--amber); }
  .explained { color:var(--purple); } .muted { color:var(--muted); }
  .banner { padding:.7rem 1rem; border-radius:var(--radius); margin:1rem 0; border:1px solid var(--border);
            background:var(--surface2); font-size:.9rem; }
  .banner.err { border-color:var(--red); color:#fecaca; }
  .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; }
  .chart-wrap { position:relative; height:240px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:.75rem; }
  button, .btn { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px;
                 padding:.4rem .9rem; font-size:.85rem; font-weight:600; cursor:pointer; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=text], select { background:var(--bg); color:var(--text); border:1px solid var(--border);
                             border-radius:5px; padding:.25rem .45rem; font-size:.82rem; width:100%; }
  code, .mono { font-family:ui-monospace, Consolas, monospace; font-size:.8rem; }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  footer { margin-top:2.5rem; color:var(--muted); font-size:.75rem; text-align:center; }
</style>
