[project]
name = "cricstat-pipeline"
version = "0.1.0"
description = "Cricsheet ingestion: all_json / recently_added_7 zips into a raw SQLite store"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Archit Pandya", email = "archit@pandyahomelab.com"}]
# Runtime is the Python standard library only (requirements.txt is intentionally empty).

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = ["application_logic", "db_logic", "presentation_logic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP: keep 3.8-compatible typing (typing.List etc.) and %-formatting as written.
ignore = ["UP006", "UP007", "UP031", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "db_logic", "application_logic", "presentation_logic"]
